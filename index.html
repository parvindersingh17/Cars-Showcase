<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Enthusiast Showcase</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }
        .parallax {
            height: 100vh;
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
        }
        .section {
            height: 50vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111;
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .hero {
            background-image: url('https://wallpapercave.com/wp/wp12658451.jpg');
        }
        .classic {
            background-image: url('https://images.pexels.com/photos/30149547/pexels-photo-30149547/free-photo-of-classic-muscle-cars-racing-on-turkish-highway.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1');
        }
        .supercar {
            background-image: url('https://images.unsplash.com/photo-1613107292856-1d17447c76fd?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
        }
        .future {
            background-image: url('https://wallpapercave.com/wp/wp2090113.jpg');
        }
        .racing {
            background-image: url('https://wallpapercave.com/wp/wp2993767.jpg');
        }
        .muscle {
            background-image: url('https://wallpapercave.com/wp/wp10252328.jpg');
        }
        .Luxury {
            background-image: url('https://wallpapercave.com/wp/wp13380542.jpg');
        }
    </style>
</head>
<body>
    <div class="parallax hero"></div>
    <div class="section">Welcome to the Ultimate Car Enthusiast Showcase</div>
    <div class="parallax classic"></div>
    <div class="section">Classic Cars - Timeless Beauty</div>
    <div class="parallax supercar"></div>
    <div class="section">Supercars - The Pinnacle of Performance</div>
    <div class="parallax future"></div>
    <div class="section">Future Concepts - The Next Generation</div>
    <div class="parallax racing"></div>
    <div class="section">F1 Cars - The Thrill of Speed</div>
    <div class="parallax muscle"></div>
    <div class="section">Muscle Cars - Raw Power & Style</div>
    <div class="parallax Luxury"></div>
    <div class="section">Luxury Cars - The Pride of Mobility</div>
</body>
</html>
